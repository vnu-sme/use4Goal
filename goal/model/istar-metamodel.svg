  <path class="edge" marker-end="url(#triangle)" d="M1010 650 L1010 615 L1150 615 L1150 555"/>
  <path class="edge" marker-end="url(#triangle)" d="M1290 650 L1290 615 L1180 615 L1180 555"/>
  <path class="edge" marker-end="url(#triangle)" d="M1585 650 L1585 600 L1210 600 L1210 555"/>
  <path class="edge" marker-end="url(#triangle)" d="M1850 650 L1850 585 L1240 585 L1240 555"/>
  <path class="edge" marker-end="url(#triangle)" d="M1005 850 L1005 815 L1010 815 L1010 760"/>
  <path class="edge" marker-end="url(#triangle)" d="M1285 850 L1285 800 L1010 800 L1010 760"/>
  <path class="edge" marker-end="url(#triangle)" d="M1600 850 L1600 785 L1040 785 L1040 760"/>
  <path class="edge" marker-end="url(#triangle)" d="M1545 1030 L1545 995 L1580 995 L1580 970"/>
  <path class="edge" marker-end="url(#triangle)" d="M1755 1030 L1755 995 L1620 995 L1620 970"/>

  <!-- GoalModel -->
  <g transform="translate(250 30)">
    <rect class="box" width="330" height="110"/><rect class="head" width="330" height="45"/>
    <text class="title" x="165" y="31">GoalModel</text>
    <text class="field" x="15" y="78">name : EString [1]</text>
  </g>

  <!-- Actor hierarchy -->
  <g transform="translate(60 230)">
    <rect class="box abstract" width="330" height="130"/><rect class="head head-abstract" width="330" height="65"/>
    <text class="stereo" x="165" y="23">«abstract»</text><text class="title" x="165" y="52">Actor</text>
    <text class="field" x="15" y="92">name : EString [1] {id}</text>
  </g>
  <g transform="translate(25 455)"><rect class="box" width="150" height="70"/><rect class="head" width="150" height="70"/><text class="title" x="75" y="43">Agent</text></g>
  <g transform="translate(215 455)"><rect class="box" width="150" height="70"/><rect class="head" width="150" height="70"/><text class="title" x="75" y="43">Role</text></g>

  <!-- Intentional elements -->
  <g transform="translate(470 455)">
    <rect class="box abstract" width="360" height="120"/><rect class="head head-abstract" width="360" height="65"/>
    <text class="stereo" x="180" y="23">«abstract»</text><text class="title" x="180" y="52">IntentionalElement</text>
    <text class="field" x="15" y="91">id : EString [1] {id}</text><text class="field" x="15" y="113">description : EString [0..1]</text>

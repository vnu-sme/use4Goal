<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1420" viewBox="0 0 2200 1420">
  <defs>
    <style>
      .bg { fill:#ffffff; }
      .box { fill:#f8fafc; stroke:#1f2937; stroke-width:2; }
      .abstract { fill:#eef2ff; }
      .relation { fill:#f0fdf4; }
      .enum { fill:#fff7ed; }
      .head { fill:#e5e7eb; stroke:#1f2937; stroke-width:2; }
      .head-abstract { fill:#c7d2fe; }
      .head-relation { fill:#bbf7d0; }
      .head-enum { fill:#fed7aa; }
      .title { font:700 24px sans-serif; fill:#111827; text-anchor:middle; }
      .stereo { font:italic 17px sans-serif; fill:#374151; text-anchor:middle; }
      .field { font:18px monospace; fill:#111827; }
      .edge { fill:none; stroke:#374151; stroke-width:2.2; }
      .contain { fill:none; stroke:#111827; stroke-width:2.5; }
      .label { font:17px sans-serif; fill:#111827; paint-order:stroke; stroke:#fff; stroke-width:5; stroke-linejoin:round; }
      .note { font:18px sans-serif; fill:#374151; }
    </style>
    <marker id="triangle" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 12 1 L 1 7 L 12 13 z" fill="#fff" stroke="#374151" stroke-width="1.5"/>
    </marker>
    <marker id="diamond" markerWidth="16" markerHeight="16" refX="2" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 8 L 8 2 L 15 8 L 8 14 z" fill="#111827"/>
    </marker>
  </defs>
  <rect class="bg" width="2200" height="1420"/>

  <!-- containment and reference edges -->
  <path class="contain" marker-start="url(#diamond)" d="M350 140 L350 185 L225 185 L225 230"/>
  <text class="label" x="230" y="178">actors 1..*</text>
  <path class="contain" marker-start="url(#diamond)" d="M430 140 L430 180 L1835 180 L1835 230"/>
  <text class="label" x="1610" y="171">dependencies 0..*</text>
  <path class="contain" marker-start="url(#diamond)" d="M510 140 L510 160 L1510 160 L1510 230"/>
  <text class="label" x="1280" y="151">actorAssociations 0..*</text>
  <path class="contain" marker-start="url(#diamond)" d="M225 360 L225 410 L650 410 L650 455"/>
  <text class="label" x="400" y="402">elements 0..*</text>
  <path class="contain" marker-start="url(#diamond)" d="M285 360 L285 390 L1180 390 L1180 455"/>
  <text class="label" x="935" y="382">relations 0..*</text>
  <path class="contain" marker-start="url(#diamond)" d="M470 1030 L470 990 L300 990 L300 970"/>
  <text class="label" x="305" y="982">activation 0..1</text>
  <path class="contain" marker-start="url(#diamond)" d="M550 1030 L550 1010 L340 1010 L340 970"/>
  <text class="label" x="350" y="1003">condition 0..1</text>
  <path class="contain" marker-start="url(#diamond)" d="M630 1030 L630 985 L390 985 L390 970"/>
  <text class="label" x="510" y="978">precondition 0..1</text>
  <path class="contain" marker-start="url(#diamond)" d="M700 1030 L700 965 L430 965"/>
  <text class="label" x="535" y="958">postcondition 0..1</text>

  <!-- generalizations -->

  <path class="edge" marker-end="url(#triangle)" d="M290 455 L290 395 L225 395 L225 360"/>
  <path class="edge" marker-end="url(#triangle)" d="M525 650 L525 615 L650 615 L650 575"/>
  <path class="edge" marker-end="url(#triangle)" d="M740 650 L740 615 L650 615 L650 575"/>
  <path class="edge" marker-end="url(#triangle)" d="M650 850 L650 815 L740 815 L740 780"/>
  <path class="edge" marker-end="url(#triangle)" d="M510 1030 L510 995 L650 995 L650 970"/>

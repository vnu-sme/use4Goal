    <text class="stereo" x="130" y="23">«abstract»</text><text class="title" x="130" y="52">ConcreteIntentional</text>
    <text class="title" x="130" y="83">Element</text>
  </g>
  <g transform="translate(530 850)">
    <rect class="box abstract" width="240" height="120"/><rect class="head head-abstract" width="240" height="65"/>
    <text class="stereo" x="120" y="23">«abstract»</text><text class="title" x="120" y="52">GoalTaskElement</text>
  </g>
  <g transform="translate(430 1030)"><rect class="box" width="180" height="140"/><rect class="head" width="180" height="45"/><text class="title" x="90" y="31">Goal</text><text class="field" x="10" y="72">goalType : GoalType</text><text class="field" x="10" y="99">activation [0..1]</text><text class="field" x="10" y="126">condition [0..1]</text></g>
  <g transform="translate(630 1030)"><rect class="box" width="180" height="115"/><rect class="head" width="180" height="45"/><text class="title" x="90" y="31">Task</text><text class="field" x="10" y="75">precondition [0..1]</text><text class="field" x="10" y="102">postcondition [0..1]</text></g>
  <g transform="translate(760 1030)"><rect class="box" width="140" height="70"/><rect class="head" width="140" height="70"/><text class="title" x="70" y="43">Resource</text></g>
  <g transform="translate(150 850)">
    <rect class="box" width="300" height="90"/><rect class="head" width="300" height="45"/><text class="title" x="150" y="31">IStarOclConstraint</text>
    <text class="field" x="15" y="75">oclBody : EString [1]</text>
  </g>


  <g transform="translate(1000 455)">
    <rect class="box abstract relation" width="360" height="100"/><rect class="head head-relation" width="360" height="65"/>
    <text class="stereo" x="180" y="23">«abstract»</text><text class="title" x="180" y="52">IntentionalRelation</text>
    <text class="field" x="15" y="91">owner : Actor [1]</text>
  </g>
  <g transform="translate(900 650)">
    <rect class="box abstract relation" width="220" height="110"/><rect class="head head-relation" width="220" height="65"/>
    <text class="stereo" x="110" y="23">«abstract»</text><text class="title" x="110" y="52">Refinement</text>
    <text class="field" x="10" y="96">parent : GoalTask [1]</text>
  </g>
  <g transform="translate(1140 650)">
    <rect class="box relation" width="300" height="110"/><rect class="head head-relation" width="300" height="45"/><text class="title" x="150" y="31">Contribution</text>
    <text class="field" x="10" y="73">type : ContributionType</text><text class="field" x="10" y="99">source → quality</text>
  </g>
  <g transform="translate(1460 650)">
    <rect class="box relation" width="250" height="110"/><rect class="head head-relation" width="250" height="45"/><text class="title" x="125" y="31">Qualification</text>
    <text class="field" x="10" y="73">quality → element</text>
  </g>
  <g transform="translate(1740 650)">
    <rect class="box relation" width="220" height="110"/><rect class="head head-relation" width="220" height="45"/><text class="title" x="110" y="31">NeededBy</text>
    <text class="field" x="10" y="73">resource → task</text>
  </g>
  <g transform="translate(880 850)"><rect class="box relation" width="250" height="120"/><rect class="head head-relation" width="250" height="45"/><text class="title" x="125" y="31">AndRefinement</text><text class="field" x="10" y="76">children : GoalTask</text><text class="field" x="10" y="101">[2..*] {unique}</text></g>
  <g transform="translate(1160 850)"><rect class="box relation" width="250" height="120"/><rect class="head head-relation" width="250" height="45"/><text class="title" x="125" y="31">OrRefinement</text><text class="field" x="10" y="76">children : GoalTask</text><text class="field" x="10" y="101">[1..*] {unique}</text></g>
  <g transform="translate(1450 850)"><rect class="box abstract relation" width="300" height="120"/><rect class="head head-relation" width="300" height="65"/><text class="stereo" x="150" y="23">«abstract»</text><text class="title" x="150" y="52">ParameterRefinement</text><text class="field" x="10" y="91">child : GoalTask [1]</text><text class="field" x="10" y="114">actorType : Actor [1]</text></g>
  <g transform="translate(1450 1030)"><rect class="box relation" width="190" height="70"/><rect class="head head-relation" width="190" height="70"/><text class="title" x="95" y="43">ForRefinement</text></g>
  <g transform="translate(1660 1030)"><rect class="box relation" width="190" height="70"/><rect class="head head-relation" width="190" height="70"/><text class="title" x="95" y="43">PickRefinement</text></g>

  <!-- cross-actor structures -->
  <g transform="translate(1370 230)">
    <rect class="box" width="280" height="140"/><rect class="head" width="280" height="45"/><text class="title" x="140" y="31">ActorAssociation</text>
    <text class="field" x="12" y="76">kind : AssociationKind [1]</text><text class="field" x="12" y="103">source : Actor [1]</text><text class="field" x="12" y="130">target : Actor [1]</text>
  </g>
  <g transform="translate(1680 230)">
    <rect class="box" width="430" height="190"/><rect class="head" width="430" height="45"/><text class="title" x="215" y="31">Dependency</text>
    <text class="field" x="15" y="76">depender : Actor [1]</text>
    <text class="field" x="15" y="103">dependerElement : IntentionalElement [0..1]</text><text class="field" x="15" y="130">◆ dependum : IntentionalElement [1]</text>
    <text class="field" x="15" y="157">dependee : Actor [1]</text><text class="field" x="15" y="184">dependeeElement : IntentionalElement [0..1]</text>
  </g>

  <!-- enums -->
  <g transform="translate(30 1190)"><rect class="box enum" width="300" height="165"/><rect class="head head-enum" width="300" height="65"/><text class="stereo" x="150" y="23">«EEnum»</text><text class="title" x="150" y="52">GoalType</text><text class="field" x="15" y="92">Achieve</text><text class="field" x="15" y="119">Maintain</text><text class="field" x="15" y="146">Sustain</text></g>
  <g transform="translate(360 1190)"><rect class="box enum" width="300" height="190"/><rect class="head head-enum" width="300" height="65"/><text class="stereo" x="150" y="23">«EEnum»</text><text class="title" x="150" y="52">ContributionType</text><text class="field" x="15" y="92">Make</text><text class="field" x="15" y="119">Help</text><text class="field" x="15" y="146">Hurt</text><text class="field" x="15" y="173">Break</text></g>
  <g transform="translate(720 1190)"><rect class="box enum" width="340" height="130"/><rect class="head head-enum" width="340" height="65"/><text class="stereo" x="170" y="23">«EEnum»</text><text class="title" x="170" y="52">AssociationKind</text><text class="field" x="15" y="92">is-a</text><text class="field" x="15" y="119">participates-in</text></g>

  <text class="note" x="1770" y="1240">Canonical source: goal/model/istar.ecore</text>
</svg>
